<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News - MusicNewsID</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .news-header {
      padding: 20px;
      text-align: center;
    }

    .news-header h1 {
      margin-bottom: 5px;
    }

    .card small {
      color: #aaa;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 20px;
    }

    nav a {
      margin-left: 12px;
      text-decoration: none;
      color: white;
    }

    nav a:hover {
      color: #ffcc00;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">📰 MusicNewsID</div>

  <!-- MENU ADMIN SUDAH DIHAPUS -->
  <nav>
    <a href="index.html">Home</a>
    <a href="news.html">News</a>
    <a href="post.html">Post</a>
  </nav>
</header>

<!-- HEADER NEWS -->
<section class="news-header">
  <h1>Berita Musik Indonesia</h1>
  <p>Update artis, lagu, dan industri musik terbaru</p>
</section>

<!-- LIST NEWS -->
<section class="container">

  <h2>🔥 Artikel Terbaru</h2>

  <div id="newsList"></div>

</section>

<script>

function loadNews() {
  let news = JSON.parse(localStorage.getItem("news") || "[]");
  let container = document.getElementById("newsList");

  let html = "";

  if (news.length === 0) {
    container.innerHTML = `<div class="empty">Belum ada artikel dari admin.</div>`;
    return;
  }

  news.forEach((n, index) => {

    if (!n || !n.title || !n.content) return;

    html += `
      <div class="card">
        <h3>${escapeHTML(n.title)}</h3>
        <small>🕒 ${n.time || "unknown"}</small>
        <p>${escapeHTML(n.content.substring(0, 150))}...</p>

        <a href="news-detail.html?id=${index}" style="color:#ffcc00;">Baca Selengkapnya</a>
      </div>
    `;
  });

  container.innerHTML = html;
}

// anti error / security kecil
function escapeHTML(text) {
  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

loadNews();

</script>

</body>
</html>
