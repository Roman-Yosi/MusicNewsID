<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Berita - MusicNewsID</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  margin:0;
  color:#fff;
}

/* HEADER */
header{
  background:#111827;
  color:#fff;
  padding:15px;
  text-align:center;
  border-bottom:2px solid #22c55e;
}

/* CONTAINER */
.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

/* CARD */
.card{
  background:#111827;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.25);
}

/* IMAGE */
img{
  width:100%;
  border-radius:10px;
  margin-top:10px;
}

/* BUTTON */
a{
  display:inline-block;
  margin-top:10px;
  background:#22c55e;
  color:#000;
  padding:8px 12px;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

a:hover{
  opacity:0.85;
}

/* STATUS */
.status{
  text-align:center;
  padding:20px;
  color:#aaa;
}

.error{
  background:#7f1d1d;
  color:#fff;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>📰 Berita MusicNewsID</h1>
</header>

<div class="container" id="list">
  <div class="status">Loading berita...</div>
</div>

<!-- SUPABASE SCRIPT -->
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://PROJECT_URL.supabase.co",
  "sb_publishable_3FDzjw1DsNnZCn_0TXSXGA_-EE6IxdY"
);

function safeText(text){
  return String(text || "").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

async function loadNews(){

  const list = document.getElementById("list");

  let { data, error } = await supabase
    .from("posts")
    .select("*")
    .order("created_at", { ascending: false });

  if(error){
    list.innerHTML = `
      <div class="card error">
        ❌ Error: ${error.message}
      </div>
    `;
    return;
  }

  if(!data || data.length === 0){
    list.innerHTML = `<div class="status">Belum ada berita</div>`;
    return;
  }

  list.innerHTML = "";

  data.forEach(item => {
    list.innerHTML += `
      <div class="card">

        <h3>${safeText(item.title || "Tanpa Judul")}</h3>

        ${item.image ? `<img src="${item.image}">` : ""}

        <p>
          ${safeText(item.content ? item.content.substring(0,120) : "Tidak ada isi")}...
        </p>

        <a href="news-detail.html?id=${item.id}">
          Baca Selengkapnya →
        </a>

      </div>
    `;
  });
}

loadNews();
</script>

</body>
</html>
