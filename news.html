<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">MusicNewsID Admin</div>
</header>

<section class="container" id="loginBox">

  <h2>🔒 Login Admin</h2>

  <input type="password" id="pass" placeholder="Masukkan password">
  <br><br>

  <button onclick="login()">Masuk</button>

</section>

<section class="container" id="adminPanel" style="display:none;">

  <h2>📝 Tambah Berita</h2>

  <input id="title" placeholder="Judul berita"><br><br>
  <textarea id="content" placeholder="Isi berita"></textarea><br><br>

  <button onclick="saveNews()">Simpan</button>

  <h3>📌 Preview</h3>
  <div id="list"></div>

</section>

<script>

const PASSWORD = "12345666"; // PASSWORD KAMU (tanpa # biar aman)

function login() {
  let pass = document.getElementById("pass").value;

  if (pass === PASSWORD) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadNews();
  } else {
    alert("Password salah!");
  }
}

function saveNews() {
  let title = document.getElementById("title").value.trim();
  let content = document.getElementById("content").value.trim();

  if (!title || !content) {
    alert("Isi tidak boleh kosong!");
    return;
  }

  let news = JSON.parse(localStorage.getItem("news") || "[]");

  news.unshift({title, content});
  localStorage.setItem("news", JSON.stringify(news));

  loadNews();

  document.getElementById("title").value = "";
  document.getElementById("content").value = "";
}

function loadNews() {
  let news = JSON.parse(localStorage.getItem("news") || "[]");

  let html = "";

  if (news.length === 0) {
    html = "<p>Belum ada berita.</p>";
  }

  news.forEach(n => {

    if (!n || !n.title || !n.content) return; // 🔥 FIX ERROR DATA

    html += `
      <div class="card">
        <h3>${escapeHTML(n.title)}</h3>
        <p>${escapeHTML(n.content)}</p>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

// 🔒 Anti script / error HTML
function escapeHTML(text) {
  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

</script>

</body>
</html>
