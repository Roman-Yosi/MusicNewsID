<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - MusicNewsID</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .panel {
      background:#1c1c1c;
      padding:20px;
      border-radius:10px;
      margin-bottom:20px;
    }

    input, textarea {
      width:100%;
      padding:10px;
      margin-top:8px;
      margin-bottom:12px;
      border-radius:6px;
      border:1px solid #333;
      background:#111;
      color:white;
    }

    button {
      padding:10px 15px;
      background:#ffcc00;
      border:none;
      font-weight:bold;
      cursor:pointer;
      border-radius:6px;
    }

    button:hover {
      opacity:0.8;
    }

    .badge {
      display:inline-block;
      padding:4px 8px;
      background:#ffcc00;
      color:black;
      font-size:12px;
      border-radius:4px;
      margin-bottom:10px;
    }

    .card small {
      color:#aaa;
      font-size:12px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🛠 MusicNewsID Admin Panel</div>
</header>

<section class="container">

  <!-- DASHBOARD INFO -->
  <div class="panel">
    <span class="badge">ADMIN DASHBOARD</span>
    <h2>📊 Control Berita MusicNewsID</h2>
    <p>Gunakan panel ini untuk menambah, melihat, dan mengelola artikel berita musik.</p>
  </div>

  <!-- FORM INPUT -->
  <div class="panel">
    <h3>📝 Buat Artikel Baru</h3>

    <label>Judul Artikel</label>
    <input id="title" placeholder="Contoh: Roman Yosi Rilis Lagu Baru">

    <label>Isi Artikel</label>
    <textarea id="content" rows="6" placeholder="Tulis isi berita di sini..."></textarea>

    <button onclick="saveNews()">+ Publikasikan</button>
  </div>

  <!-- PREVIEW -->
  <div class="panel">
    <h3>📌 Artikel Terbaru (Preview)</h3>
    <div id="list"></div>
  </div>

</section>

<script>

function saveNews() {
  let title = document.getElementById("title").value.trim();
  let content = document.getElementById("content").value.trim();

  if (!title || !content) {
    alert("Judul dan isi wajib diisi!");
    return;
  }

  let news = JSON.parse(localStorage.getItem("news") || "[]");

  news.unshift({
    title,
    content,
    time: new Date().toLocaleString()
  });

  localStorage.setItem("news", JSON.stringify(news));

  document.getElementById("title").value = "";
  document.getElementById("content").value = "";

  loadNews();
}

function loadNews() {
  let news = JSON.parse(localStorage.getItem("news") || "[]");

  let html = "";

  if (news.length === 0) {
    html = "<p>Belum ada artikel dipublikasikan.</p>";
  }

  news.forEach(n => {

    if (!n || !n.title || !n.content) return;

    html += `
      <div class="card">
        <h3>${escapeHTML(n.title)}</h3>
        <small>🕒 ${n.time || "unknown"}</small>
        <p>${escapeHTML(n.content.substring(0, 150))}...</p>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

function escapeHTML(text) {
  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

loadNews();

</script>

</body>
</html>
