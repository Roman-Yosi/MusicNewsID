<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>MusicNewsID</title>
  <style>
    body { font-family: Arial; margin: 20px; background:#f5f5f5; }
    .post { background:#fff; padding:15px; margin-bottom:15px; border-radius:10px; }
    .post h2 { font-size:18px; margin:0 0 10px; }
    .post a { text-decoration:none; color:#222; }
    .date { font-size:12px; color:gray; }
  </style>
</head>
<body>

<h1>MusicNewsID - Berita Terbaru</h1>
<div id="news"></div>

<script>
const feedUrl = "https://musicnewsid.blogspot.com/feeds/posts/default?alt=json";

fetch(feedUrl)
  .then(res => res.json())
  .then(data => {
    let posts = data.feed.entry;
    let html = "";

    posts.forEach(post => {
      let title = post.title.$t;
      let link = post.link.find(l => l.rel === "alternate").href;
      let date = post.published.$t;

      html += `
        <div class="post">
          <h2><a href="${link}" target="_blank">${title}</a></h2>
          <div class="date">${date}</div>
        </div>
      `;
    });

    document.getElementById("news").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("news").innerHTML =
      "Gagal memuat artikel dari Blogger.";
  });
</script>

</body>
</html>
