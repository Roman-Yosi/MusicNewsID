<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusicNewsID</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
}

/* HEADER ala Blogger */
header{
  background:#111;
  color:#fff;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
}

/* LOGO kecil seperti Blogger */
header img{
  width:28px;
  height:28px;
  border-radius:50%;
}

header span{
  font-size:16px;
  font-weight:bold;
}

/* FEED */
.feed{
  max-width:650px;
  margin:auto;
  padding:10px;
}

/* CARD */
.post{
  background:#fff;
  margin-bottom:12px;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* GAMBAR HARUS BESAR DI DEPAN */
.post img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#ddd;
}

/* CONTENT */
.content{
  padding:12px;
}

.title{
  font-size:16px;
  font-weight:bold;
  margin:0 0 6px;
}

.desc{
  font-size:13px;
  color:#444;
}

.read{
  display:inline-block;
  margin-top:8px;
  color:#1a73e8;
  text-decoration:none;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<!-- HEADER BLOGGER STYLE -->
<header>
  <img src="https://raw.githubusercontent.com/Roman-Yosi/Logo-Brand-Musicos-Studio/refs/heads/main/MusicNewsId.png">
  <span>MusicNewsID</span>
</header>

<div class="feed" id="feed">
  <div class="loading">Memuat artikel...</div>
</div>

<script>
const url =
"https://musicnewsid.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=10&callback=load";

function load(data){

  let html = "";

  if(!data.feed.entry){
    document.getElementById("feed").innerHTML =
      "<div class='loading'>Tidak ada artikel</div>";
    return;
  }

  data.feed.entry.forEach(post => {

    const title = post.title?.$t || "No Title";

    let link = "#";
    post.link.forEach(l=>{
      if(l.rel==="alternate") link = l.href;
    });

    let content = post.summary?.$t || post.content?.$t || "";
    content = content.replace(/<[^>]*>/g,'').substring(0,120);

    /* 🔥 FIX GAMBAR (INI YANG SELALU ERROR DI VERSI KAMU) */
    let img = "";

    if(post.media$thumbnail){
      img = post.media$thumbnail.url.replace("s72-c","s600");
    } else {
      /* fallback ambil gambar dari konten */
      let match = post.content?.$t?.match(/<img[^>]+src="([^">]+)"/);
      img = match ? match[1] : "https://via.placeholder.com/600x300?text=MusicNewsID";
    }

    html += `
      <div class="post">
        <img src="${img}">
        <div class="content">
          <div class="title">${title}</div>
          <div class="desc">${content}...</div>
          <a class="read" href="${link}" target="_blank">Baca Selengkapnya</a>
        </div>
      </div>
    `;
  });

  document.getElementById("feed").innerHTML = html;
}

const s = document.createElement("script");
s.src = url;
document.body.appendChild(s);
</script>

</body>
</html>
