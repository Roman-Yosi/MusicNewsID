<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusicNewsID</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
}

/* HEADER ala Blogger */
header{
  background:#111;
  color:#fff;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  height:32px;
  border-radius:50%;
}

/* FEED STYLE (seperti Blogger mobile m=1) */
.feed{
  max-width:600px;
  margin:auto;
  padding:10px;
}

/* CARD POST */
.post{
  background:#fff;
  margin-bottom:12px;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* THUMBNAIL */
.post img{
  width:100%;
  height:200px;
  object-fit:cover;
}

/* CONTENT */
.content{
  padding:12px;
}

.title{
  font-size:16px;
  font-weight:bold;
  margin:0 0 8px;
}

.desc{
  font-size:13px;
  color:#444;
}

.read{
  display:inline-block;
  margin-top:8px;
  color:#1a73e8;
  text-decoration:none;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/Roman-Yosi/Logo-Brand-Musicos-Studio/refs/heads/main/MusicNewsId.png">
    <strong>MusicNewsID</strong>
  </div>
</header>

<div class="feed" id="feed">
  <div class="loading">Memuat artikel...</div>
</div>

<script>
const url =
"https://musicnewsid.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=10&callback=load";

function load(data){

  let html = "";

  if(!data.feed.entry){
    document.getElementById("feed").innerHTML =
      "<div class='loading'>Tidak ada artikel</div>";
    return;
  }

  data.feed.entry.forEach(post => {

    const title = post.title?.$t || "";

    let link = "#";
    post.link.forEach(l=>{
      if(l.rel==="alternate") link = l.href;
    });

    let content = post.summary?.$t || post.content?.$t || "";
    content = content.replace(/<[^>]*>/g,'').substring(0,120);

    // ambil gambar artikel (thumbnail Blogger)
    let img = "";
    if(post.media$thumbnail){
      img = post.media$thumbnail.url.replace("s72-c","s600");
    } else {
      img = "https://via.placeholder.com/600x300?text=MusicNewsID";
    }

    html += `
      <div class="post">
        <img src="${img}">
        <div class="content">
          <div class="title">${title}</div>
          <div class="desc">${content}...</div>
          <a class="read" href="${link}" target="_blank">Baca Artikel</a>
        </div>
      </div>
    `;
  });

  document.getElementById("feed").innerHTML = html;
}

const s = document.createElement("script");
s.src = url;
document.body.appendChild(s);
</script>

</body>
</html>
