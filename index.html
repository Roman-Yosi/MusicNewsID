<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">MusicNewsID</div>
</header>

<div class="container">

  <h2>Berita Terbaru</h2>

  <div id="blog">Memuat artikel...</div>

</div>

<script>
async function loadBlog() {
  try {

    // FEED YANG PALING STABIL (JANGAN ALT JSON)
    const rssFeed = "https://musicnewsid.blogspot.com/feeds/posts/default";

    // RSS to JSON converter (lebih stabil dari fetch langsung)
    const apiUrl = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssFeed);

    const res = await fetch(apiUrl);
    const data = await res.json();

    console.log("FEED DATA:", data);

    if (!data.items || data.items.length === 0) {
      document.getElementById("blog").innerHTML = "Tidak ada artikel ditemukan.";
      return;
    }

    let html = "";

    data.items.forEach(post => {

      let title = post.title;
      let content = post.content || post.description || "";

      // bersihkan HTML
      let clean = content.replace(/<[^>]*>/g, '');

      html += `
        <div class="post">
          <h3>${title}</h3>
          <p>${clean.substring(0, 200)}...</p>
          <a href="${post.link}" target="_blank">Baca Selengkapnya</a>
        </div>
      `;
    });

    document.getElementById("blog").innerHTML = html;

  } catch (error) {
    console.log("ERROR FEED:", error);
    document.getElementById("blog").innerHTML = "Gagal memuat artikel dari Blogger.";
  }
}

loadBlog();
</script>

</body>
</html>
