<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>

  <link rel="stylesheet" href="style.css">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>

<body>

<header class="header">
  <div class="logo">MusicNewsID</div>

  <nav class="nav">
    <a href="#">HOME</a>
    <a href="#">MUSIC</a>
    <a href="#">TRENDING</a>
  </nav>
</header>

<main class="container">

  <h1>Berita Terbaru</h1>

  <div id="news" class="grid">Memuat artikel...</div>

</main>

<script>
async function loadBlog() {
  try {

    const rss = "https://musicnewsid.blogspot.com/feeds/posts/default?alt=rss&nocache=" + Date.now();
    const api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rss);

    const res = await fetch(api);
    const data = await res.json();

    let html = "";

    if (!data.items || data.items.length === 0) {
      document.getElementById("news").innerHTML = "Belum ada artikel.";
      return;
    }

    data.items.forEach(post => {

      let title = post.title || "Tanpa Judul";

      // FIX: ambil teks bersih saja
      let desc = post.description
        ? post.description.replace(/<[^>]*>/g,'')
        : "";

      let link = post.link;

      html += `
        <article class="card">
          <h2>${title}</h2>
          <p>${desc.substring(0, 140)}...</p>
          <a href="${link}" target="_blank">Baca Selengkapnya →</a>
        </article>
      `;
    });

    document.getElementById("news").innerHTML = html;

  } catch (err) {
    console.log(err);
    document.getElementById("news").innerHTML = "Gagal memuat artikel.";
  }
}

loadBlog();
</script>

</body>
</html>
