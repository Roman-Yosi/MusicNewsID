<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusicNewsID</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#fff;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#111;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  height:35px;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:10px;
}

/* HERO */
.hero{
  text-align:center;
  padding:40px 20px;
  background:#1a1a1a;
}

/* POST */
.card{
  background:#1e1e1e;
  margin:10px;
  padding:15px;
  border-radius:8px;
}

.card h3{
  margin:0 0 10px;
}

.card p{
  color:#ccc;
}

.card a{
  color:#ffcc00;
  text-decoration:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/Roman-Yosi/Logo-Brand-Musicos-Studio/refs/heads/main/MusicNewsId.png">
    <strong>MusicNewsID</strong>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="https://musicnewsid.blogspot.com/">Blogger</a>
  </nav>
</header>

<div class="hero">
  <h2>Berita Musik Indonesia</h2>
  <p>Semua artikel dari Blogger</p>
</div>

<div id="posts">
  <div class="card">Memuat artikel...</div>
</div>

<footer>
  © 2026 MusicNewsID
</footer>

<script>
const url = "https://musicnewsid.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=10&callback=load";

function load(data){

  let html = "";

  if(!data.feed.entry){
    document.getElementById("posts").innerHTML =
      "<div class='card'>Tidak ada artikel</div>";
    return;
  }

  data.feed.entry.forEach(post => {

    let title = post.title.$t;
    let link = "#";

    post.link.forEach(l=>{
      if(l.rel === "alternate") link = l.href;
    });

    let content = post.summary ? post.summary.$t : "";
    content = content.replace(/<[^>]*>/g,'').substring(0,150);

    html += `
      <div class="card">
        <h3>${title}</h3>
        <p>${content}...</p>
        <a href="${link}" target="_blank">Baca Selengkapnya</a>
      </div>
    `;
  });

  document.getElementById("posts").innerHTML = html;
}

const s = document.createElement("script");
s.src = url;
document.body.appendChild(s);
</script>

</body>
</html>
