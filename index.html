<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">MusicNews</div>

  <nav>
    <a href="#">HOME</a>
    <a href="#">MUSIC</a>
    <a href="#">TRENDING</a>
  </nav>
</header>

<section class="container">

  <h1>Berita Terbaru</h1>

  <div id="news">Memuat artikel...</div>

</section>

<script>
async function loadBlog() {
  try {

    const rss = "https://musicnewsid.blogspot.com/feeds/posts/default?alt=rss";
    const api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rss);

    const res = await fetch(api);
    const data = await res.json();

    let html = "";

    if (!data.items || data.items.length === 0) {
      document.getElementById("news").innerHTML = "Belum ada artikel.";
      return;
    }

    data.items.forEach(post => {

      let title = post.title;
      let desc = post.description.replace(/<[^>]*>/g,'');
      let link = post.link;

      html += `
        <div class="card">
          <h2>${title}</h2>
          <p>${desc.substring(0, 180)}...</p>
          <a href="${link}" target="_blank">Baca Selengkapnya</a>
        </div>
      `;
    });

    document.getElementById("news").innerHTML = html;

  } catch (err) {
    console.log(err);
    document.getElementById("news").innerHTML = "Gagal memuat artikel.";
  }
}

loadBlog();
</script>

</body>
</html>
