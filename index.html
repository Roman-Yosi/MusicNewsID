<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">MusicNewsID</div>
</header>

<div class="container">

  <h2>Berita Terbaru</h2>

  <div id="blog">Memuat artikel...</div>

</div>

<!-- JSONP SCRIPT (ANTI ERROR CORS) -->
<script>
function loadBlog(data) {
  try {

    let entries = data.feed.entry;
    let html = "";

    if (!entries) {
      document.getElementById("blog").innerHTML = "Tidak ada artikel.";
      return;
    }

    entries.forEach(post => {

      let title = post.title.$t;

      let content = post.content?.$t || post.summary?.$t || "";
      let clean = content.replace(/<[^>]*>/g,'');

      // ambil link
      let link = "";
      if (post.link) {
        for (let i = 0; i < post.link.length; i++) {
          if (post.link[i].rel === "alternate") {
            link = post.link[i].href;
            break;
          }
        }
      }

      html += `
        <div class="post">
          <h2>${title}</h2>
          <p>${clean.substring(0, 200)}...</p>
          <a href="${link}" target="_blank">Baca Selengkapnya</a>
        </div>
      `;
    });

    document.getElementById("blog").innerHTML = html;

  } catch (err) {
    console.log(err);
    document.getElementById("blog").innerHTML = "Gagal memuat artikel dari Blogger.";
  }
}
</script>

<!-- CALL BLOGGER JSONP -->
<script src="https://musicnewsid.blogspot.com/feeds/posts/default?alt=json-in-script&callback=loadBlog"></script>

</body>
</html>
