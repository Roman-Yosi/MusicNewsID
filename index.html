<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">MusicNewsID</div>

  <nav>
    <a href="#">HOME</a>
    <a href="#">MUSIC</a>
    <a href="#">TRENDING</a>
  </nav>
</header>

<!-- HERO / HALAMAN UTAMA -->
<section class="hero">
  <h1>Berita Musik Terbaru Indonesia</h1>
  <p>Update artikel, trending musik, dan berita artis setiap hari</p>
</section>

<!-- ARTIKEL UTAMA -->
<section class="container">

  <h2>🔥 Artikel Terbaru</h2>

  <div id="news">Loading berita...</div>

</section>

<script>
async function loadBlog() {
  try {

    const rss = "https://musicnewsid.blogspot.com/feeds/posts/default?alt=rss";
    const api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rss);

    const res = await fetch(api);
    const data = await res.json();

    let html = "";

    data.items.forEach((post, index) => {

      let title = post.title;
      let desc = post.description.replace(/<[^>]*>/g,'');
      let link = post.link;

      // ARTIKEL PERTAMA (HEADLINE BESAR)
      if (index === 0) {
        html += `
          <div class="featured">
            <h2>${title}</h2>
            <p>${desc.substring(0, 200)}...</p>
            <a href="${link}" target="_blank">Baca Selengkapnya</a>
          </div>
        `;
      }

      // ARTIKEL LAIN
      else {
        html += `
          <div class="card">
            <h3>${title}</h3>
            <p>${desc.substring(0, 120)}...</p>
            <a href="${link}" target="_blank">Baca</a>
          </div>
        `;
      }
    });

    document.getElementById("news").innerHTML = html;

  } catch (err) {
    document.getElementById("news").innerHTML = "Gagal memuat artikel.";
    console.log(err);
  }
}

loadBlog();
</script>

</body>
</html>
