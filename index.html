<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">MusicNewsID</div>

  <nav>
    <a href="#">HOME</a>
    <a href="#">MUSIC</a>
    <a href="#">TRENDING</a>
  </nav>
</header>

<section class="container">

  <h1>Berita Terbaru</h1>

  <div id="news"></div>

</section>

<script>
async function loadBlog() {
  const res = await fetch("https://musicnewsid.blogspot.com/feeds/posts/default?alt=json");
  const data = await res.json();

  const posts = data.feed.entry;
  let html = "";

  posts.forEach(post => {
    let title = post.title.$t;
    let content = post.content.$t;

    // hapus tag HTML
    let clean = content.replace(/<[^>]*>/g, "");

    html += `
      <div class="card">
        <h2>${title}</h2>
        <p>${clean.substring(0, 180)}...</p>
      </div>
    `;
  });

  document.getElementById("news").innerHTML = html;
}

loadBlog();
</script>

</body>
</html>
