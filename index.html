<!DOCTYPE html>
<html>
<head>
  <title>MusicNewsID</title>
</head>
<body>

<h1>MusicNewsID</h1>
<div id="news"></div>

<script>
fetch("rss.json")
  .then(res => res.json())
  .then(data => {
    let html = "";
    data.forEach(item => {
      html += `
        <div style="margin-bottom:20px">
          <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
          <small>${item.date}</small>
          <p>${item.description}</p>
        </div>
      `;
    });
    document.getElementById("news").innerHTML = html;
  });
</script>

</body>
</html>
