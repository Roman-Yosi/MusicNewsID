<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">MusicNewsID</div>
</header>

<div class="container">

  <h2>Berita Terbaru</h2>

  <div id="blog">Memuat artikel...</div>

</div>

<script>
async function loadBlog() {
  try {

    // 🔥 FEED OFFICIAL BLOGGER (PALING STABIL)
    const url = "https://musicnewsid.blogspot.com/feeds/posts/default?alt=atom";

    const res = await fetch(url);
    const xmlText = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, "text/xml");

    const entries = xml.getElementsByTagName("entry");

    if (!entries.length) {
      document.getElementById("blog").innerHTML = "Tidak ada artikel.";
      return;
    }

    let html = "";

    for (let i = 0; i < entries.length; i++) {

      let title = entries[i].getElementsByTagName("title")[0].textContent;

      let content = entries[i].getElementsByTagName("content")[0]?.textContent ||
                    entries[i].getElementsByTagName("summary")[0]?.textContent ||
                    "";

      // bersihkan HTML
      let clean = content.replace(/<[^>]*>/g,'');

      let link = entries[i].getElementsByTagName("link")[0].getAttribute("href");

      html += `
        <div class="post">
          <h2>${title}</h2>
          <p>${clean.substring(0, 220)}...</p>
          <a href="${link}" target="_blank">Baca Selengkapnya</a>
        </div>
      `;
    }

    document.getElementById("blog").innerHTML = html;

  } catch (err) {
    console.log(err);
    document.getElementById("blog").innerHTML = "Gagal memuat artikel dari Blogger.";
  }
}

loadBlog();
</script>

</body>
</html>
