<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusicNewsID</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
}

/* HEADER */
header{
  background:#111;
  color:#fff;
  padding:10px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header img{
  width:28px;
  height:28px;
  border-radius:50%;
}

header span{
  font-weight:bold;
}

/* NAV */
.nav{
  background:#1a1a1a;
  color:#fff;
  padding:10px;
  font-size:14px;
}

/* CONTAINER */
.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

/* POST STYLE (SEPERTI BLOGGER) */
.post{
  margin-bottom:35px;
  border-bottom:1px solid #ddd;
  padding-bottom:25px;
}

.post h1{
  font-size:22px;
  margin:10px 0;
}

.date{
  font-size:12px;
  color:#777;
  margin-bottom:10px;
}

/* BREAKING */
.breaking{
  background:#ffefc2;
  padding:10px;
  font-size:14px;
  margin-bottom:15px;
  border-left:4px solid #ff9900;
}

/* CONTENT */
.content{
  font-size:15px;
  line-height:1.6;
  color:#222;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="https://raw.githubusercontent.com/Roman-Yosi/Logo-Brand-Musicos-Studio/refs/heads/main/MusicNewsId.png">
    <span>MusicNewsID</span>
  </div>
</header>

<div class="nav">
  Home | Music | Trending
</div>

<div class="container" id="posts">
  <p>Memuat artikel...</p>
</div>

<footer>
© 2026 MusicNewsID
</footer>

<script>
const url =
"https://musicnewsid.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=10&callback=load";

function load(data){

  let html = "";

  if(!data.feed.entry){
    document.getElementById("posts").innerHTML =
    "<p>Tidak ada postingan</p>";
    return;
  }

  data.feed.entry.forEach((post, index) => {

    const title = post.title.$t;

    let link = "#";
    post.link.forEach(l=>{
      if(l.rel==="alternate") link = l.href;
    });

    let content = post.content?.$t || post.summary?.$t || "";
    let clean = content.replace(/<[^>]*>/g,'').substring(0,800);

    let date = post.published?.$t || "";

    // BREAKING POST (POST TERATAS)
    let breaking = "";
    if(index === 0){
      breaking = `<div class="breaking">🔥 BREAKING: ${title}</div>`;
    }

    html += `
      <div class="post">
        ${breaking}
        <h1><a href="${link}" target="_blank" style="color:#111;text-decoration:none;">
          ${title}
        </a></h1>

        <div class="date">${date}</div>

        <div class="content">
          ${clean}
        </div>
      </div>
    `;
  });

  document.getElementById("posts").innerHTML = html;
}

const s = document.createElement("script");
s.src = url;
document.body.appendChild(s);
</script>

</body>
</html>
