```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID - Berita Musik Indonesia</title>
<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#fff;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:#111;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  font-size:20px;
}

.logo img{
  height:40px;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:15px;
  font-weight:500;
}

nav a:hover{
  color:#ffcc00;
}

.hero{
  text-align:center;
  padding:70px 20px;
  background:linear-gradient(45deg,#111,#222);
}

.hero h1{
  margin:0;
  font-size:34px;
}

.hero p{
  color:#ccc;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
}

.card h3{
  margin-top:0;
}

.card p{
  color:#ccc;
}

.card a{
  color:#ffcc00;
  text-decoration:none;
  font-weight:bold;
}

.card a:hover{
  text-decoration:underline;
}

footer{
  text-align:center;
  padding:20px;
  background:#111;
  color:#aaa;
  margin-top:40px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/Roman-Yosi/Logo-Brand-Musicos-Studio/refs/heads/main/MusicNewsId.png" alt="MusicNewsID">
    <span>MusicNewsID</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="https://musicnewsid.blogspot.com/" target="_blank">Admin Blogger</a>
  </nav>
</header>

<section class="hero">
  <h1>Berita Musik Indonesia Terbaru</h1>
  <p>Semua artikel otomatis terhubung dari Blogger MusicNewsID</p>
</section>

<section class="container">
  <h2>🔥 Berita Terbaru</h2>

  <div id="news-container">
    <p>Memuat artikel...</p>
  </div>
</section>

<footer>
  © 2026 MusicNewsID - All Rights Reserved
</footer>

<script>
const feedUrl =
'https://musicnewsid.blogspot.com/feeds/posts/default?alt=json-in-script&callback=loadPosts';

function loadPosts(data){

  let html = "";

  if(!data.feed.entry){
    document.getElementById("news-container").innerHTML =
      "<p>Belum ada artikel.</p>";
    return;
  }

  data.feed.entry.forEach(post => {

    let title = post.title.$t;

    let link = "#";
    post.link.forEach(item=>{
      if(item.rel === "alternate"){
        link = item.href;
      }
    });

    let content = "";

    if(post.summary){
      content = post.summary.$t;
    }else if(post.content){
      content = post.content.$t;
    }

    content = content.replace(/<[^>]*>/g,'');
    content = content.substring(0,200) + "...";

    html += `
      <div class="card">
        <h3>${title}</h3>
        <p>${content}</p>
        <a href="${link}" target="_blank">
          Baca Selengkapnya
        </a>
      </div>
    `;
  });

  document.getElementById("news-container").innerHTML = html;
}

const script = document.createElement("script");
script.src = feedUrl;
document.body.appendChild(script);
</script>

</body>
</html>
