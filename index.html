<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusicNewsID</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f1f1;
  color:#111;
}

/* HEADER mirip Blogger */
header{
  background:#111;
  color:#fff;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  height:35px;
}

/* HERO */
.hero{
  background:#fff;
  padding:20px;
  text-align:center;
}

/* POST STYLE (mirip Blogger m=1) */
.post{
  background:#fff;
  margin:10px;
  padding:15px;
  border-radius:8px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.post h3{
  margin:0 0 10px;
  font-size:18px;
}

.post p{
  color:#444;
  font-size:14px;
}

.post a{
  display:inline-block;
  margin-top:10px;
  color:#1a73e8;
  text-decoration:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/Roman-Yosi/Logo-Brand-Musicos-Studio/refs/heads/main/MusicNewsId.png">
    <strong>MusicNewsID</strong>
  </div>

  <a href="https://musicnewsid.blogspot.com/" style="color:#fff;text-decoration:none;">Blogger</a>
</header>

<div class="hero">
  <h2>Berita Musik Indonesia</h2>
  <p>Update otomatis dari Blogger</p>
</div>

<div id="posts">
  <div class="post">Memuat artikel...</div>
</div>

<footer>
  © 2026 MusicNewsID
</footer>

<script>
const url = "https://musicnewsid.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=10&callback=load";

function load(data){

  let html = "";

  if(!data.feed.entry){
    document.getElementById("posts").innerHTML =
      "<div class='post'>Tidak ada artikel</div>";
    return;
  }

  data.feed.entry.forEach(p => {

    let title = p.title.$t;
    let link = "#";

    p.link.forEach(l=>{
      if(l.rel==="alternate") link = l.href;
    });

    let content = "";
    if(p.summary) content = p.summary.$t;

    content = content.replace(/<[^>]*>/g,'').substring(0,150);

    html += `
      <div class="post">
        <h3>${title}</h3>
        <p>${content}...</p>
        <a href="${link}" target="_blank">Baca</a>
      </div>
    `;
  });

  document.getElementById("posts").innerHTML = html;
}

const s = document.createElement("script");
s.src = url;
document.body.appendChild(s);
</script>

</body>
</html>
