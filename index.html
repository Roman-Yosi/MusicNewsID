<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID - Berita Musik Indonesia</title>
<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#fff;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:#111;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  font-size:20px;
}

.logo img{
  height:40px;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:15px;
  font-weight:500;
}

nav a:hover{
  color:#ffcc00;
}

.hero{
  text-align:center;
  padding:70px 20px;
  background:linear-gradient(45deg,#111,#222);
}

.hero h1{
  margin:0;
  font-size:34px;
}

.hero p{
  color:#ccc;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
}

.card h3{
  margin-top:0;
}

.card p{
  color:#ccc;
}

.card a{
  color:#ffcc00;
  text-decoration:none;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:20px;
  background:#111;
  color:#aaa;
  margin-top:40px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/Roman-Yosi/Logo-Brand-Musicos-Studio/refs/heads/main/MusicNewsId.png">
    <span>MusicNewsID</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="https://musicnewsid.blogspot.com/" target="_blank">Admin Blogger</a>
  </nav>
</header>

<section class="hero">
  <h1>Berita Musik Indonesia Terbaru</h1>
  <p>Semua artikel otomatis dari WordPress</p>
</section>

<section class="container">
  <h2>🔥 Berita Terbaru</h2>

  <div id="news-container">
    <p>Memuat artikel...</p>
  </div>
</section>

<footer>
  © 2026 MusicNewsID - All Rights Reserved
</footer>

<script>
const rssUrl = "https://romanyosi5.wordpress.com/feed/";

fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrl))
.then(res => res.json())
.then(data => {

  let container = document.getElementById("news-container");
  let html = "";

  data.items.forEach(item => {

    html += `
      <div class="card">
        <h3>${item.title}</h3>
        <p>${item.description.replace(/<[^>]*>/g,'').substring(0,180)}...</p>
        <a href="${item.link}" target="_blank">Baca Selengkapnya</a>
      </div>
    `;
  });

  container.innerHTML = html;

})
.catch(err => {
  document.getElementById("news-container").innerHTML =
  "<p>Gagal memuat RSS WordPress</p>";
});
</script>

</body>
</html>
