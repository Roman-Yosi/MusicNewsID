<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusicNewsID - Portal Berita Musik Indonesia</title>
<meta name="description" content="Portal berita musik Indonesia terbaru dari Blogger MusicNewsID">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#fff;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#111;
  position:sticky;
  top:0;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
}

.logo img{
  height:35px;
}

/* HERO */
.hero{
  padding:40px 20px;
  text-align:center;
  background:linear-gradient(45deg,#111,#222);
}

.hero h1{
  margin:0;
  font-size:28px;
}

.hero p{
  color:#ccc;
}

/* NEWS GRID */
.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

/* CARD */
.card{
  background:#1a1a1a;
  border-radius:10px;
  padding:15px;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.02);
}

.card h3{
  font-size:16px;
  margin:0 0 10px;
}

.card p{
  font-size:13px;
  color:#ccc;
}

.card a{
  display:inline-block;
  margin-top:10px;
  color:#ffcc00;
  text-decoration:none;
  font-weight:bold;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  color:#777;
  margin-top:30px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/Roman-Yosi/Logo-Brand-Musicos-Studio/refs/heads/main/MusicNewsId.png">
    <span>MusicNewsID</span>
  </div>

  <nav>
    <a href="#" style="color:white;text-decoration:none;">Home</a>
  </nav>
</header>

<section class="hero">
  <h1>Portal Berita Musik Indonesia</h1>
  <p>Semua artikel otomatis dari Blogger</p>
</section>

<section class="container">
  <h2>🔥 Artikel Terbaru</h2>

  <div id="news" class="grid">
    <div class="card">Memuat artikel...</div>
  </div>
</section>

<footer>
  © 2026 MusicNewsID - All Rights Reserved
</footer>

<script>
const url =
"https://musicnewsid.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=12&callback=loadPosts";

function loadPosts(data){

  let html = "";

  if(!data.feed.entry){
    document.getElementById("news").innerHTML =
      "<div class='card'>Tidak ada artikel</div>";
    return;
  }

  data.feed.entry.forEach(post => {

    const title = post.title?.$t || "No Title";

    let link = "#";
    if(post.link){
      post.link.forEach(l=>{
        if(l.rel === "alternate") link = l.href;
      });
    }

    let content = post.summary?.$t || post.content?.$t || "";
    content = content.replace(/<[^>]*>/g,'').substring(0,120);

    html += `
      <div class="card">
        <h3>${title}</h3>
        <p>${content}...</p>
        <a href="${link}" target="_blank">Baca Selengkapnya</a>
      </div>
    `;
  });

  document.getElementById("news").innerHTML = html;
}

const s = document.createElement("script");
s.src = url;
document.body.appendChild(s);
</script>

</body>
</html>
