<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID - Berita Musik Indonesia</title>

<meta name="description" content="MusicNewsID - Portal berita musik Indonesia terbaru">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://roman-yosi.github.io/MusicNewsID/">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#fff;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:#111;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  font-size:20px;
}

.logo img{
  height:40px;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:15px;
  font-weight:500;
}

nav a:hover{
  color:#ffcc00;
}

/* HERO */
.hero{
  text-align:center;
  padding:60px 20px;
  background:linear-gradient(45deg,#111,#222);
}

.hero h1{
  margin:0;
  font-size:32px;
}

.hero p{
  color:#ccc;
}

/* CONTAINER */
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

/* CARD */
.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:10px;
  margin-bottom:15px;
}

.card h3{
  margin:0 0 10px;
}

.card p{
  color:#ccc;
}

.card a{
  color:#ffcc00;
  text-decoration:none;
  font-weight:bold;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  background:#111;
  color:#aaa;
  margin-top:40px;
}

/* LOADING */
.loading{
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/Roman-Yosi/Logo-Brand-Musicos-Studio/refs/heads/main/MusicNewsId.png">
    <span>MusicNewsID</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="https://musicnewsid.blogspot.com/" target="_blank">Blogger Admin</a>
  </nav>
</header>

<section class="hero">
  <h1>Berita Musik Indonesia Terbaru</h1>
  <p>Update otomatis dari Blogger / WordPress</p>
</section>

<section class="container">
  <h2>🔥 Berita Terbaru</h2>

  <div id="news-container">
    <p class="loading">Memuat artikel...</p>
  </div>
</section>

<footer>
  © 2026 MusicNewsID - All Rights Reserved
</footer>

<script>
const rssUrl = "https://musicnewsid.blogspot.com/feeds/posts/default?alt=rss";

async function loadNews(){
  try{

    const res = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(rssUrl));
    const data = await res.json();

    if(!data.contents){
      throw new Error("RSS kosong");
    }

    const parser = new DOMParser();
    const xml = parser.parseFromString(data.contents, "text/xml");

    const items = Array.from(xml.querySelectorAll("item"));

    if(items.length === 0){
      document.getElementById("news-container").innerHTML =
      "<p>Tidak ada artikel</p>";
      return;
    }

    let html = "";

    items.forEach(item => {

      const title = item.querySelector("title")?.textContent || "No Title";
      const link = item.querySelector("link")?.textContent || "#";
      const desc = item.querySelector("description")?.textContent || "";

      const clean = desc.replace(/<[^>]*>/g,'').substring(0,160);

      html += `
        <div class="card">
          <h3>${title}</h3>
          <p>${clean}...</p>
          <a href="${link}" target="_blank">Baca Selengkapnya</a>
        </div>
      `;
    });

    document.getElementById("news-container").innerHTML = html;

  } catch(err){
    console.log(err);
    document.getElementById("news-container").innerHTML =
    "<p>Gagal memuat artikel (RSS error / koneksi)</p>";
  }
}

loadNews();
</script>

</body>
</html>
