<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f1f1;
}

/* 🔥 TOP BAR seperti Blogger */
.topbar{
  background:#ff5722;
  color:white;
  padding:10px 15px;
  display:flex;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:1000;
}

/* LOGO */
.topbar img{
  width:28px;
  height:28px;
}

/* TITLE */
.topbar span{
  font-weight:bold;
  font-size:16px;
}

/* MENU */
.menu{
  margin-left:auto;
  font-size:14px;
}

/* HERO */
.hero{
  padding:20px;
  background:white;
  text-align:left;
}

/* FEED */
.container{
  max-width:800px;
  margin:auto;
  padding:10px;
}

.post{
  background:white;
  margin-bottom:10px;
  padding:15px;
  border-radius:6px;
}

.post h3{
  margin:0 0 10px 0;
  font-size:18px;
}

.post p{
  color:#444;
  font-size:14px;
}

.post a{
  color:#ff5722;
  font-weight:bold;
  text-decoration:none;
}

.post img{
  width:100%;
  border-radius:6px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<!-- 🔥 HEADER BLOGGER STYLE -->
<div class="topbar">
  <img src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Blogger_icon.svg">
  <span>MusicNewsID</span>

  <div class="menu">Home • Trending</div>
</div>

<div class="hero">
  <h2>🔥 Breaking News Musik Indonesia</h2>
  <p>Update otomatis dari Blogger</p>
</div>

<div class="container" id="feed">
  <p>Memuat artikel...</p>
</div>

<script>
const feedUrl =
"https://musicnewsid.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=10&callback=load";

function load(data){

  let html = "";

  data.feed.entry.forEach(post => {

    let title = post.title.$t;

    let link = "#";
    post.link.forEach(l=>{
      if(l.rel==="alternate") link = l.href;
    });

    let content = post.summary?.$t || post.content?.$t || "";
    content = content.replace(/<[^>]*>/g,'').substring(0,180);

    let img = "";
    let match = (post.content?.$t || "").match(/<img[^>]+src="([^">]+)"/);
    if(match) img = match[1];

    html += `
      <div class="post">
        ${img ? `<img src="${img}">` : ""}
        <h3>${title}</h3>
        <p>${content}...</p>
        <a href="${link}" target="_blank">Baca Selengkapnya</a>
      </div>
    `;
  });

  document.getElementById("feed").innerHTML = html;
}

const s = document.createElement("script");
s.src = feedUrl;
document.body.appendChild(s);
</script>

</body>
</html>
