<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  MusicNewsID
</header>

<section class="container">
  <h2>Berita Terbaru (Auto RSS)</h2>

  <div id="news">Loading artikel...</div>
</section>

<script>
async function loadRSS() {
  const rssUrl = "https://romanyosi5.wordpress.com/feed/";

  const api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrl);

  try {
    const res = await fetch(api);
    const data = await res.json();

    if (!data.items) throw new Error("RSS tidak terbaca");

    document.getElementById("news").innerHTML =
      data.items.map(item => `
        <div class="card">
          <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
          <p>${item.description.replace(/<[^>]*>/g,'').substring(0,120)}...</p>
        </div>
      `).join("");

  } catch (err) {
    document.getElementById("news").innerHTML =
      "<div class='card'>Gagal load RSS WordPress</div>";
  }
}

loadRSS();
</script>

</body>
</html>
