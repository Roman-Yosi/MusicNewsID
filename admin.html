<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Panel - MusicNewsID</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #fff;
}

/* LOGIN */
#loginBox{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#0f172a;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#loginBox input{
  padding:10px;
  width:240px;
  border:none;
  border-radius:6px;
  outline:none;
}

#loginBox button{
  margin-top:10px;
  padding:10px 20px;
  background:#22c55e;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

/* HEADER */
header {
  background: #111827;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  border-bottom: 2px solid #22c55e;
}

/* CONTAINER */
.container {
  display: none;
  grid-template-columns: 220px 1fr;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  background: #1f2937;
  padding: 20px;
}

.sidebar a {
  display: block;
  color: #fff;
  text-decoration: none;
  margin-bottom: 15px;
  padding: 10px;
  border-radius: 6px;
  background: #111827;
}

.sidebar a:hover {
  background: #22c55e;
}

/* CONTENT */
.content {
  padding: 20px;
  overflow-y: auto;
}

.card {
  background: #111827;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

input, textarea, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

button {
  background: #22c55e;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #16a34a;
}

.danger {
  background: red !important;
}

img {
  margin-top: 10px;
  border-radius: 8px;
}

</style>
</head>

<body>

<!-- LOGIN GATE -->
<div id="loginBox">
  <h2>🔐 Admin Login</h2>
  <input type="password" id="pass" placeholder="Password admin">
  <button onclick="login()">Masuk</button>
</div>

<header>🎵 MusicNewsID Admin Panel</header>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="#dashboard">Dashboard</a>
    <a href="#artikel">Artikel</a>
    <a href="#gambar">Galeri</a>
    <a href="#konten">Kelola Konten</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="card" id="dashboard">
      <h2>📊 Dashboard</h2>
      <p>Selamat datang di Admin MusicNewsID</p>
    </div>

    <div class="card" id="artikel">
      <h2>📝 Upload Artikel Musik</h2>

      <input id="title" type="text" placeholder="Judul Artikel">
      <input id="image" type="text" placeholder="URL Gambar (opsional)">
      <textarea id="content" rows="6" placeholder="Isi artikel..."></textarea>

      <button onclick="publish()">Publish Artikel</button>
    </div>

    <div class="card" id="gambar">
      <h2>🖼 Galeri Gambar</h2>

      <input type="file" id="fileInput">
      <button onclick="uploadGallery()">Upload ke Galeri</button>

      <p id="status"></p>

      <div id="galleryList"></div>
    </div>

    <div class="card" id="konten">
      <h2>📂 Kelola Artikel</h2>
      <div id="list"></div>
    </div>

  </div>

</div>

<script>

let isLogin = false;

/* LOGIN */
function login(){
  const pass = document.getElementById("pass").value;
  const adminPass = "romanyosi123";

  if(pass === adminPass){
    isLogin = true;
    document.getElementById("loginBox").style.display = "none";
    document.querySelector(".container").style.display = "grid";
    init();
  } else {
    alert("Password salah!");
  }
}

/* LOGOUT */
function logout(){
  location.reload();
}

/* CHECK */
function check(){
  if(!isLogin){
    alert("Silakan login dulu!");
    return false;
  }
  return true;
}

/* INIT */
function init(){
  load();
  loadGallery();
}

/* LOAD ARTIKEL */
function load(){
  let data = JSON.parse(localStorage.getItem("news") || "[]");
  let list = document.getElementById("list");

  list.innerHTML = "";

  data.forEach((item, index) => {
    list.innerHTML += `
      <div class="card">
        <h3>${item.title}</h3>
        ${item.image ? `<img src="${item.image}" style="width:100%;">` : ""}
        <p>${item.content.substring(0,120)}...</p>
        <button class="danger" onclick="hapus(${index})">Hapus</button>
      </div>
    `;
  });
}

/* PUBLISH */
function publish(){
  if(!check()) return;

  let title = document.getElementById("title").value;
  let image = document.getElementById("image").value;
  let content = document.getElementById("content").value;

  if(!title || !content){
    alert("Judul & isi wajib diisi!");
    return;
  }

  let data = JSON.parse(localStorage.getItem("news") || "[]");

  data.unshift({
    id: Date.now(),
    title,
    image,
    content
  });

  localStorage.setItem("news", JSON.stringify(data));

  document.getElementById("title").value = "";
  document.getElementById("image").value = "";
  document.getElementById("content").value = "";

  load();
}

/* DELETE */
function hapus(index){
  let data = JSON.parse(localStorage.getItem("news") || "[]");
  data.splice(index,1);
  localStorage.setItem("news", JSON.stringify(data));
  load();
}

/* GALERI */
function uploadGallery(){
  if(!check()) return;

  const file = document.getElementById("fileInput").files[0];

  if(!file){
    document.getElementById("status").innerText = "Pilih gambar dulu!";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){
    let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");

    gallery.unshift({
      id: Date.now(),
      img: e.target.result
    });

    localStorage.setItem("gallery", JSON.stringify(gallery));

    document.getElementById("status").innerText = "Upload berhasil!";
    loadGallery();
  };

  reader.readAsDataURL(file);
}

/* LOAD GALERI */
function loadGallery(){
  let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");
  let box = document.getElementById("galleryList");

  box.innerHTML = "";

  gallery.forEach((item,i)=>{
    box.innerHTML += `
      <div class="card">
        <img src="${item.img}" style="width:100%;">
        <button class="danger" onclick="deleteGallery(${i})">Hapus</button>
      </div>
    `;
  });
}

/* DELETE GALERI */
function deleteGallery(i){
  let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");
  gallery.splice(i,1);
  localStorage.setItem("gallery", JSON.stringify(gallery));
  loadGallery();
}

</script>

</body>
</html>
