<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin MusicNewsID</title>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
header{background:#111;color:#fff;padding:15px;text-align:center}
.container{max-width:800px;margin:auto;padding:15px}
.card{background:#fff;padding:20px;border-radius:10px}
input,textarea{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:6px}
button{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:6px;cursor:pointer}
button:hover{background:#333}
.status{margin-top:10px;font-size:14px}
</style>

</head>
<body>

<header>
<h1>Admin MusicNewsID (Firebase Mode)</h1>
</header>

<div class="container">
<div class="card">

<h2>Tambah Berita</h2>

<input id="judul" placeholder="Judul berita">
<textarea id="isi" placeholder="Isi berita..."></textarea>

<button onclick="publish()">Publish</button>

<div class="status" id="status"></div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } 
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBeMfwo9TZLN39DQf1rykfo2uBClfP21kY",
  authDomain: "ai-studio-applet-webapp-fbf67.firebaseapp.com",
  projectId: "ai-studio-applet-webapp-fbf67",
  storageBucket: "ai-studio-applet-webapp-fbf67.appspot.com",
  messagingSenderId: "831721646868",
  appId: "1:831721646868:web:308bbf0a9f796f11b4f001"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const status = document.getElementById("status");

window.publish = async function(){

  const title = document.getElementById("judul").value.trim();
  const content = document.getElementById("isi").value.trim();

  if(!title || !content){
    status.innerText = "❌ Isi lengkap dulu";
    return;
  }

  try {
    status.innerText = "⏳ Menyimpan ke Firebase...";

    await addDoc(collection(db, "musicnews_articles"), {
      title: title,
      content: content,
      date: serverTimestamp()
    });

    status.innerText = "✅ Berhasil masuk Firebase!";

    document.getElementById("judul").value = "";
    document.getElementById("isi").value = "";

  } catch (e) {
    console.error(e);
    status.innerText = "❌ Gagal (cek Firebase Rules / Config)";
  }

};

</script>

</body>
</html>
