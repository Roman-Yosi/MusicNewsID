<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin MusicNewsID</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#111;color:#fff;padding:15px;text-align:center;}
.container{max-width:600px;margin:auto;padding:15px;}
.card{background:#fff;padding:20px;border-radius:10px;}
input,textarea{width:100%;padding:10px;margin:10px 0;}
button{width:100%;padding:10px;background:#111;color:#fff;border:none;cursor:pointer;}
</style>
</head>
<body>

<header>
<h1>Admin Panel</h1>
</header>

<div class="container">
<div class="card">

<input id="title" placeholder="Judul artikel">
<input id="image" placeholder="URL gambar (opsional)">
<textarea id="content" placeholder="Isi artikel"></textarea>

<button onclick="publish()">Publish</button>

</div>
</div>

<script>
function publish(){

  let title = document.getElementById("title").value;
  let image = document.getElementById("image").value;
  let content = document.getElementById("content").value;

  if(!title || !content){
    alert("Judul & isi wajib diisi!");
    return;
  }

  let data = JSON.parse(localStorage.getItem("news") || "[]");

  data.unshift({
    id: Date.now(),
    title,
    image,
    content
  });

  localStorage.setItem("news", JSON.stringify(data));

  alert("Berhasil dipublish!");

  document.getElementById("title").value = "";
  document.getElementById("image").value = "";
  document.getElementById("content").value = "";
}
</script>

</body>
</html>
