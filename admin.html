<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* =========================
   SUPABASE (FIX URL)
========================= */
const supabase = createClient(
  "https://YOUR_PROJECT_URL.supabase.co",
  "sb_publishable_3FDzjw1DsNnZCn_0TXSXGA_-EE6IxdY"
);

/* =========================
   STATE
========================= */
let isLogin = false;

/* =========================
   SAFETY: CEGAH BLANK SCREEN
========================= */
window.addEventListener("error", (e) => {
  console.log("JS ERROR:", e.message);
});

window.addEventListener("DOMContentLoaded", () => {
  console.log("Admin loaded OK");
});

/* =========================
   LOGIN
========================= */
function login() {
  const pass = document.getElementById("pass")?.value;

  if (!pass) {
    alert("Isi password dulu!");
    return;
  }

  if (pass === "romanyosi123") {
    isLogin = true;

    document.getElementById("loginBox").style.display = "none";
    document.querySelector(".container").style.display = "grid";

    init();
  } else {
    alert("Password salah!");
  }
}

/* =========================
   CHECK LOGIN
========================= */
function check() {
  if (!isLogin) {
    alert("Silakan login dulu!");
    return false;
  }
  return true;
}

/* =========================
   INIT
========================= */
function init() {
  load();
  loadGallery();
}

/* =========================
   SAFE TEXT
========================= */
function safe(t) {
  return String(t || "")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

/* =========================
   PUBLISH (LOCAL STORAGE)
========================= */
function publish() {
  if (!check()) return;

  const title = document.getElementById("title")?.value;
  const image = document.getElementById("image")?.value;
  const content = document.getElementById("content")?.value;

  if (!title || !content) {
    alert("Judul & isi wajib diisi!");
    return;
  }

  let data = JSON.parse(localStorage.getItem("news") || "[]");

  data.unshift({
    id: Date.now(),
    title,
    image,
    content
  });

  localStorage.setItem("news", JSON.stringify(data));

  load();

  alert("Berhasil dipublish!");
}

/* =========================
   LOAD NEWS (ANTI BLANK)
========================= */
function load() {
  const list = document.getElementById("list");

  if (!list) {
    console.log("Element #list tidak ada");
    return;
  }

  let data = JSON.parse(localStorage.getItem("news") || "[]");

  if (data.length === 0) {
    list.innerHTML = `<div class="card">Belum ada berita</div>`;
    return;
  }

  list.innerHTML = "";

  data.forEach((item, index) => {
    list.innerHTML += `
      <div class="card">
        <h3>${safe(item.title)}</h3>

        ${item.image ? `<img src="${item.image}" style="width:100%">` : ""}

        <p>${safe((item.content || "").substring(0,120))}...</p>

        <button class="danger" onclick="hapus(${index})">
          Hapus
        </button>
      </div>
    `;
  });
}

/* =========================
   DELETE NEWS
========================= */
function hapus(i) {
  let data = JSON.parse(localStorage.getItem("news") || "[]");
  data.splice(i, 1);
  localStorage.setItem("news", JSON.stringify(data));
  load();
}

/* =========================
   GALLERY
========================= */
function uploadGallery() {
  if (!check()) return;

  const file = document.getElementById("fileInput")?.files[0];

  if (!file) {
    alert("Pilih gambar dulu!");
    return;
  }

  const reader = new FileReader();

  reader.onload = (e) => {
    let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");

    gallery.unshift({
      id: Date.now(),
      img: e.target.result
    });

    localStorage.setItem("gallery", JSON.stringify(gallery));
    loadGallery();
  };

  reader.readAsDataURL(file);
}

/* =========================
   LOAD GALLERY
========================= */
function loadGallery() {
  const box = document.getElementById("galleryList");
  if (!box) return;

  let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");

  if (gallery.length === 0) {
    box.innerHTML = `<div class="card">Belum ada gambar</div>`;
    return;
  }

  box.innerHTML = "";

  gallery.forEach((item, i) => {
    box.innerHTML += `
      <div class="card">
        <img src="${item.img}" style="width:100%">
        <button class="danger" onclick="deleteGallery(${i})">Hapus</button>
      </div>
    `;
  });
}

/* =========================
   DELETE GALLERY
========================= */
function deleteGallery(i) {
  let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");
  gallery.splice(i, 1);
  localStorage.setItem("gallery", JSON.stringify(gallery));
  loadGallery();
}

/* =========================
   GLOBAL FIX (WAJIB)
========================= */
window.login = login;
window.publish = publish;
window.hapus = hapus;
window.uploadGallery = uploadGallery;
window.deleteGallery = deleteGallery;

</script>
