<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin MusicNewsID</title>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
header{background:#111;color:#fff;padding:15px;text-align:center}
.container{max-width:600px;margin:auto;padding:15px}
.card{background:#fff;padding:20px;border-radius:10px}
input,textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid #ccc;
  border-radius:6px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#111;
  color:#fff;
  border:none;
  border-radius:6px;
  font-weight:bold;
}
.status{margin-top:10px;font-size:14px}
</style>
</head>

<body>

<header>
<h1>Admin MusicNewsID</h1>
</header>

<div class="container">
  <div class="card">

    <h2>Tambah Berita</h2>

    <input id="judul" placeholder="Judul berita">
    <textarea id="isi" placeholder="Isi berita..."></textarea>

    <button onclick="publish()">Publish</button>

    <div class="status" id="status"></div>

  </div>
</div>

<!-- FIREBASE COMPAT (WAJIB INI) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>
// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyBeMfwo9TZLN39DQf1rykfo2uBClfP21kY",
  authDomain: "ai-studio-applet-webapp-fbf67.firebaseapp.com",
  projectId: "ai-studio-applet-webapp-fbf67",
  storageBucket: "ai-studio-applet-webapp-fbf67.appspot.com",
  messagingSenderId: "831721646868",
  appId: "1:831721646868:web:308bbf0a9f796f11b4f001"
};

// INIT FIREBASE
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function publish(){

  const title = document.getElementById("judul").value.trim();
  const content = document.getElementById("isi").value.trim();
  const status = document.getElementById("status");

  if(!title || !content){
    status.innerText = "❌ Isi judul dan berita dulu";
    return;
  }

  status.innerText = "⏳ Menyimpan ke Firebase...";

  db.collection("musicnews_articles").add({
    title: title,
    content: content,
    createdAt: new Date().toISOString()
  })
  .then((docRef) => {
    status.innerText = "✅ BERHASIL! ID: " + docRef.id;
    document.getElementById("judul").value = "";
    document.getElementById("isi").value = "";
  })
  .catch((error) => {
    console.error(error);
    status.innerText = "❌ Gagal: " + error.message;
  });

}
</script>

</body>
</html>
