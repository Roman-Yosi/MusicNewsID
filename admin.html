<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  "https://YOUR_PROJECT_URL.supabase.co",
  "sb_publishable_3FDzjw1DsNnZCn_0TXSXGA_-EE6IxdY"
);

/* =========================
   LOGIN
========================= */
let isLogin = false;

function login(){
  const pass = document.getElementById("pass").value;
  const adminPass = "romanyosi123";

  if(pass === adminPass){
    isLogin = true;
    document.getElementById("loginBox").style.display = "none";
    document.querySelector(".container").style.display = "grid";
    init();
  } else {
    alert("Password salah!");
  }
}

/* =========================
   PUBLISH (MASIH LOCAL STORAGE)
========================= */
function publish(){
  if(!check()) return;

  let title = document.getElementById("title").value;
  let image = document.getElementById("image").value;
  let content = document.getElementById("content").value;

  if(!title || !content){
    alert("Judul & isi wajib diisi!");
    return;
  }

  // NANTI DIUBAH KE SUPABASE
  let data = JSON.parse(localStorage.getItem("news") || "[]");

  data.unshift({
    id: Date.now(),
    title,
    image,
    content
  });

  localStorage.setItem("news", JSON.stringify(data));

  load();
}

/* =========================
   CHECK LOGIN
========================= */
function check(){
  if(!isLogin){
    alert("Silakan login dulu!");
    return false;
  }
  return true;
}

/* =========================
   INIT
========================= */
function init(){
  load();
  loadGallery();
}

/* =========================
   LOAD ARTIKEL
========================= */
function load(){
  let data = JSON.parse(localStorage.getItem("news") || "[]");
  let list = document.getElementById("list");

  list.innerHTML = "";

  data.forEach((item, index) => {
    list.innerHTML += `
      <div class="card">
        <h3>${item.title}</h3>
        ${item.image ? `<img src="${item.image}" style="width:100%;">` : ""}
        <p>${item.content.substring(0,120)}...</p>
        <button class="danger" onclick="hapus(${index})">Hapus</button>
      </div>
    `;
  });
}

/* =========================
   DELETE
========================= */
function hapus(i){
  let data = JSON.parse(localStorage.getItem("news") || "[]");
  data.splice(i,1);
  localStorage.setItem("news", JSON.stringify(data));
  load();
}

/* =========================
   GALERI (masih localStorage)
========================= */
function uploadGallery(){
  if(!check()) return;

  const file = document.getElementById("fileInput").files[0];

  const reader = new FileReader();

  reader.onload = function(e){
    let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");

    gallery.unshift({
      id: Date.now(),
      img: e.target.result
    });

    localStorage.setItem("gallery", JSON.stringify(gallery));

    loadGallery();
  };

  reader.readAsDataURL(file);
}

/* LOAD GALERI */
function loadGallery(){
  let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");
  let box = document.getElementById("galleryList");

  box.innerHTML = "";

  gallery.forEach((item,i)=>{
    box.innerHTML += `
      <div class="card">
        <img src="${item.img}" style="width:100%;">
        <button class="danger" onclick="deleteGallery(${i})">Hapus</button>
      </div>
    `;
  });
}

/* DELETE GALERI */
function deleteGallery(i){
  let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");
  gallery.splice(i,1);
  localStorage.setItem("gallery", JSON.stringify(gallery));
  loadGallery();
}

</script>
