<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Panel - MusicNewsID</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #fff;
}

header {
  background: #111827;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  border-bottom: 2px solid #22c55e;
}

.container {
  display: grid;
  grid-template-columns: 220px 1fr;
  height: 100vh;
}

.sidebar {
  background: #1f2937;
  padding: 20px;
}

.sidebar a {
  display: block;
  color: #fff;
  text-decoration: none;
  margin-bottom: 15px;
  padding: 10px;
  border-radius: 6px;
  background: #111827;
}

.sidebar a:hover {
  background: #22c55e;
}

.content {
  padding: 20px;
  overflow-y: auto;
}

.card {
  background: #111827;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

input, textarea, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

button {
  background: #22c55e;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #16a34a;
}

small {
  color: #aaa;
}

</style>
</head>

<body>

<header>🎵 MusicNewsID Admin Panel</header>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="#dashboard">Dashboard</a>
    <a href="#upload">Upload News</a>
    <a href="#artikel">Upload Artikel</a>
    <a href="#gambar">Upload Gambar</a>
    <a href="#konten">Kelola Konten</a>
    <a href="index.html">Logout</a>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- DASHBOARD -->
    <div class="card" id="dashboard">
      <h2>📊 Dashboard</h2>
      <p>Selamat datang di Admin MusicNewsID</p>
      <small>Kelola artikel & berita musik kamu di sini</small>
    </div>

    <!-- UPLOAD ARTIKEL -->
    <div class="card" id="artikel">
      <h2>📝 Upload Artikel Musik</h2>

      <input id="title" type="text" placeholder="Judul Artikel">
      <input id="image" type="text" placeholder="URL Gambar (opsional)">
      <textarea id="content" rows="6" placeholder="Isi artikel..."></textarea>

      <button onclick="publish()">Publish Artikel</button>
    </div>

    <!-- UPLOAD GAMBAR -->
    <div class="card" id="gambar">
      <h2>🖼 Upload Gambar</h2>

      <input type="file" id="fileInput">
      <button onclick="previewFile()">Upload Gambar</button>

      <p id="status"></p>
    </div>

    <!-- KELOLA -->
    <div class="card" id="konten">
      <h2>📂 Kelola Konten</h2>
      <div id="list"></div>
    </div>

  </div>

</div>

<script>

// LOAD DATA
function load(){
  let data = JSON.parse(localStorage.getItem("news") || "[]");
  let list = document.getElementById("list");

  list.innerHTML = "";

  data.forEach((item, index) => {
    list.innerHTML += `
      <div class="card">
        <h3>${item.title}</h3>
        ${item.image ? `<img src="${item.image}" style="width:100%;border-radius:8px;">` : ""}
        <p>${item.content.substring(0,120)}...</p>
        <button style="background:red;margin-top:10px;" onclick="hapus(${index})">Hapus</button>
      </div>
    `;
  });
}

// PUBLISH ARTIKEL
function publish(){

  let title = document.getElementById("title").value;
  let image = document.getElementById("image").value;
  let content = document.getElementById("content").value;

  if(!title || !content){
    alert("Judul & isi wajib diisi!");
    return;
  }

  let data = JSON.parse(localStorage.getItem("news") || "[]");

  data.unshift({
    id: Date.now(),
    title,
    image,
    content
  });

  localStorage.setItem("news", JSON.stringify(data));

  document.getElementById("title").value = "";
  document.getElementById("image").value = "";
  document.getElementById("content").value = "";

  load();
  alert("Artikel berhasil dipublish!");
}

// DELETE
function hapus(index){
  let data = JSON.parse(localStorage.getItem("news") || "[]");
  data.splice(index,1);
  localStorage.setItem("news", JSON.stringify(data));
  load();
}

// PREVIEW FILE
function previewFile(){
  const file = document.getElementById("fileInput").files[0];
  if(!file){
    document.getElementById("status").innerText = "Pilih file dulu!";
    return;
  }

  document.getElementById("status").innerText =
  "File dipilih: " + file.name + " (belum upload ke server)";
}

load();

</script>

</body>
</html>
