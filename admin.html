<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin MusicNewsID</title>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
header{background:#111;color:#fff;padding:15px;text-align:center}
.container{max-width:800px;margin:auto;padding:15px}
.card{background:#fff;padding:20px;border-radius:10px}
input,textarea{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:6px}
button{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:6px}
.status{margin-top:10px;font-size:14px}
</style>

</head>
<body>

<header>
<h1>Admin MusicNewsID (Local Mode)</h1>
</header>

<div class="container">
<div class="card">

<h2>Tambah Berita</h2>

<input id="judul" placeholder="Judul berita">
<textarea id="isi" placeholder="Isi berita..."></textarea>

<button onclick="publish()">Publish</button>

<div class="status" id="status"></div>

</div>
</div>

<script>
function publish(){

  const title = document.getElementById("judul").value;
  const content = document.getElementById("isi").value;

  if(!title || !content){
    document.getElementById("status").innerText = "❌ Isi lengkap dulu";
    return;
  }

  let data = JSON.parse(localStorage.getItem("news") || "[]");

  data.unshift({
    title: title,
    content: content,
    date: new Date().toLocaleString()
  });

  localStorage.setItem("news", JSON.stringify(data));

  document.getElementById("status").innerText = "✅ Berhasil disimpan (local)";

  document.getElementById("judul").value = "";
  document.getElementById("isi").value = "";

}
</script>

</body>
</html>
