<script>
let isLogin = false;

/* LOGIN */
function login(){
  try {
    const pass = document.getElementById("pass").value;

    if(pass === "romanyosi123"){
      isLogin = true;

      document.getElementById("loginBox").style.display = "none";
      document.querySelector(".container").style.display = "grid";

      init();
    } else {
      alert("Password salah!");
    }
  } catch(e){
    console.log(e);
    alert("Login error");
  }
}

/* CHECK */
function check(){
  if(!isLogin){
    alert("Silakan login dulu!");
    return false;
  }
  return true;
}

/* INIT */
function init(){
  load();
  loadGallery();
}

/* LOAD NEWS */
function load(){
  try {
    const list = document.getElementById("list");
    if(!list) return;

    let data = JSON.parse(localStorage.getItem("news") || "[]");

    list.innerHTML = "";

    data.forEach((item, index) => {
      list.innerHTML += `
        <div class="card">
          <h3>${item.title || ""}</h3>
          ${item.image ? `<img src="${item.image}" style="width:100%">` : ""}
          <p>${(item.content || "").substring(0,120)}</p>
          <button onclick="hapus(${index})">Hapus</button>
        </div>
      `;
    });

  } catch(e){
    console.log("LOAD ERROR", e);
  }
}

/* PUBLISH */
function publish(){
  if(!check()) return;

  let data = JSON.parse(localStorage.getItem("news") || "[]");

  data.unshift({
    id: Date.now(),
    title: document.getElementById("title").value,
    image: document.getElementById("image").value,
    content: document.getElementById("content").value
  });

  localStorage.setItem("news", JSON.stringify(data));

  load();
}

/* DELETE */
function hapus(i){
  let data = JSON.parse(localStorage.getItem("news") || "[]");
  data.splice(i,1);
  localStorage.setItem("news", JSON.stringify(data));
  load();
}

/* GALLERY */
function uploadGallery(){
  if(!check()) return;

  const file = document.getElementById("fileInput").files[0];
  if(!file){
    alert("Pilih gambar!");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){
    let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");

    gallery.unshift({
      id: Date.now(),
      img: e.target.result
    });

    localStorage.setItem("gallery", JSON.stringify(gallery));
    loadGallery();
  };

  reader.readAsDataURL(file);
}

/* LOAD GALLERY */
function loadGallery(){
  const box = document.getElementById("galleryList");
  if(!box) return;

  let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");

  box.innerHTML = "";

  gallery.forEach((item,i)=>{
    box.innerHTML += `
      <div class="card">
        <img src="${item.img}" style="width:100%">
        <button onclick="deleteGallery(${i})">Hapus</button>
      </div>
    `;
  });
}

/* DELETE */
function deleteGallery(i){
  let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");
  gallery.splice(i,1);
  localStorage.setItem("gallery", JSON.stringify(gallery));
  loadGallery();
}

/* GLOBAL */
window.login = login;
window.publish = publish;
window.hapus = hapus;
window.uploadGallery = uploadGallery;
window.deleteGallery = deleteGallery;
</script>
