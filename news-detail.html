<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detail Artikel - MusicNewsID</title>
<meta name="description" content="Baca artikel lengkap dari MusicNewsID">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:#fff;
}

header{
  background:#111827;
  padding:15px;
  text-align:center;
  border-bottom:2px solid #22c55e;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111827;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

img{
  width:100%;
  border-radius:10px;
  margin-top:10px;
}

a{
  display:inline-block;
  margin-top:20px;
  color:#22c55e;
  text-decoration:none;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:40px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
<h1>📰 MusicNewsID</h1>
</header>

<div class="container">
  <div id="post" class="loading">Loading artikel...</div>
</div>

<!-- SUPABASE -->
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "https://PROJECT_URL.supabase.co",
  "sb_publishable_3FDzjw1DsNnZCn_0TXSXGA_-EE6IxdY"
);

// ambil ID dari URL
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadArticle(){

  const box = document.getElementById("post");

  if(!id){
    box.innerHTML = "<div class='card'>❌ ID artikel tidak ditemukan</div>";
    return;
  }

  let { data, error } = await supabase
    .from("posts")
    .select("*")
    .eq("id", id)
    .single();

  if(error || !data){
    box.innerHTML = "<div class='card'>❌ Artikel tidak ditemukan</div>";
    return;
  }

  box.innerHTML = `
    <div class="card">
      <h2>${data.title}</h2>

      ${data.image ? `<img src="${data.image}">` : ""}

      <p style="margin-top:15px;line-height:1.7;">
        ${data.content}
      </p>

      <a href="news.html">← Kembali ke Berita</a>
    </div>
  `;
}

loadArticle();
</script>

</body>
</html>
