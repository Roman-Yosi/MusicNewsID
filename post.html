<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Detail Berita</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>Detail Berita</h1>
</header>

<div class="container">
<div class="card" id="post"></div>
</div>

<script>
const id = new URLSearchParams(window.location.search).get("id");

const data = {
  "1": {
    title: "Roman Yosi Rilis Single Cinematic Baru",
    content: "Karya musik emosional dan sinematik modern."
  },
  "2": {
    title: "Indie Pop Semakin Viral",
    content: "Genre indie semakin mendominasi platform streaming."
  }
};

const post = document.getElementById("post");

if(!id || !data[id]){
  post.innerHTML = "<h2>Artikel tidak ditemukan</h2>";
} else {
  post.innerHTML = `
    <h2>${data[id].title}</h2>
    <p>${data[id].content}</p>
  `;
}
</script>

</body>
</html>
