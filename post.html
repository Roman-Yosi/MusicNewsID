<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  MusicNewsID
</header>

<section class="container" id="content">

</section>

<script>
const data = {
  1: {
    title: "Roman Yosi Rilis Lagu Baru",
    content: "Roman Yosi resmi merilis single terbaru dengan nuansa indie pop emosional."
  },
  2: {
    title: "Tren Musik Indonesia 2026",
    content: "Industri musik Indonesia berkembang pesat di era digital streaming."
  },
  3: {
    title: "Behind The Scene Studio",
    content: "Proses rekaman dilakukan dengan peralatan profesional di studio musik."
  }
};

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const post = data[id];

if (post) {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2>${post.title}</h2>
      <p>${post.content}</p>
    </div>
  `;
} else {
  document.getElementById("content").innerHTML =
    "<div class='card'>Artikel tidak ditemukan</div>";
}
</script>

</body>
</html>
