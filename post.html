<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Berita - MusicNewsID</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#0f0f0f;
  margin:0;
  color:white;
}

/* HEADER */
header{
  background:#111;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

/* CONTAINER */
.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

/* CARD */
.card{
  background:#1c1c1c;
  padding:20px;
  border-radius:10px;
}

/* TITLE */
h2{
  margin-top:0;
}

/* IMAGE */
img{
  width:100%;
  border-radius:10px;
  margin:15px 0;
  object-fit:cover;
}

/* META */
.meta{
  font-size:12px;
  color:#aaa;
  margin-bottom:10px;
}

/* BACK BUTTON */
.back {
  display:inline-block;
  margin-bottom:15px;
  color:#ffcc00;
  text-decoration:none;
}
.back:hover{
  opacity:0.8;
}

/* FALLBACK */
.fallback{
  padding:10px;
  background:#333;
  border-radius:8px;
  margin:10px 0;
  color:#ccc;
}
</style>

</head>

<body>

<header>
  📰 MusicNewsID - Detail Berita
</header>

<div class="container">

  <a class="back" href="news.html">← Kembali ke News</a>

  <div class="card" id="post">
    Loading...
  </div>

</div>

<script>

// ambil id dari URL
let id = new URLSearchParams(window.location.search).get("id");

// ambil data dari localStorage
let data = JSON.parse(localStorage.getItem("news") || "[]");

// cari artikel
let item = data.find(d => String(d.id) === String(id));

// container
let post = document.getElementById("post");

// jika tidak ada data
if(!item){
  post.innerHTML = "<h2>❌ Artikel tidak ditemukan</h2>";
} else {

  document.title = item.title;

  // gambar optional
  let imgHTML = "";

  if(item.image && item.image.trim() !== ""){
    imgHTML = `<img src="${item.image}" onerror="this.style.display='none'">`;
  } else {
    imgHTML = `<div class="fallback">📷 Tidak ada gambar</div>`;
  }

  // tampilkan artikel
  post.innerHTML = `
    <h2>${item.title}</h2>
    <div class="meta">
      📰 MusicNewsID • ${item.time || ""}
    </div>
    ${imgHTML}
    <p>${item.content}</p>
  `;
}

</script>

</body>
</html>
