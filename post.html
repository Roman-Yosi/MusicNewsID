<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Detail Berita</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#111;color:#fff;padding:15px;text-align:center;}
.container{max-width:700px;margin:auto;padding:15px;}
.card{background:#fff;padding:20px;border-radius:10px;}
</style>
</head>
<body>

<header>
<h1>Detail Berita</h1>
</header>

<div class="container">
<div class="card" id="post"></div>
</div>

<script>
let id = new URLSearchParams(window.location.search).get("id");

let data = JSON.parse(localStorage.getItem("news") || "[]");

let item = data.find(d => d.id == id);

let post = document.getElementById("post");

if(!item){
  post.innerHTML = "<h2>Artikel tidak ditemukan</h2>";
} else {
  post.innerHTML = `
    <h2>${item.title}</h2>
    <p>${item.content}</p>
  `;
}
</script>

</body>
</html>
