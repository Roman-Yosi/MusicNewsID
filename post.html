<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detail Berita</title>

<style>
body{
  font-family:Arial;
  background:#f4f4f4;
  margin:0;
}

header{
  background:#111;
  color:#fff;
  padding:15px;
  text-align:center;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:10px;
}

h2{
  margin-top:0;
}

img{
  width:100%;
  border-radius:10px;
  margin:10px 0;
}

.meta{
  font-size:12px;
  color:#777;
  margin-bottom:10px;
}

.fallback{
  padding:10px;
  background:#eee;
  border-radius:8px;
  margin:10px 0;
}
</style>

</head>
<body>

<header>
<h1>Detail Berita</h1>
</header>

<div class="container">
<div class="card" id="post">Loading...</div>
</div>

<script>
let id = new URLSearchParams(window.location.search).get("id");

let data = JSON.parse(localStorage.getItem("news") || "[]");

let item = data.find(d => String(d.id) === String(id));

let post = document.getElementById("post");

if(!item){
  post.innerHTML = "<h2>Artikel tidak ditemukan</h2>";
} else {

  document.title = item.title;

  let imgHTML = "";

  if(item.image && item.image.trim() !== ""){
    imgHTML = `<img src="${item.image}" onerror="this.style.display='none'">`;
  } else {
    imgHTML = `<div class="fallback">📷 Tidak ada gambar</div>`;
  }

  post.innerHTML = `
    <h2>${item.title}</h2>
    <div class="meta">MusicNewsID • ${new Date(parseInt(item.id)).toLocaleDateString()}</div>
    ${imgHTML}
    <p>${item.content}</p>
  `;
}
</script>

</body>
</html>
