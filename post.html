<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Berita</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f4f4;
}

header{
  background:#111;
  color:#fff;
  padding:15px;
  text-align:center;
}

.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

img{
  width:100%;
  border-radius:10px;
  margin-bottom:15px;
}

h1{
  font-size:22px;
  margin-bottom:10px;
}

.date{
  font-size:12px;
  color:gray;
  margin-bottom:15px;
}

.content{
  font-size:15px;
  line-height:1.6;
  white-space:pre-wrap;
}

.loading{
  text-align:center;
  padding:20px;
  color:#555;
}
</style>
</head>

<body>

<header>
<h1>Detail Berita</h1>
</header>

<div class="container">
  <div class="card" id="post">
    <div class="loading">⏳ Memuat artikel...</div>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>

// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyBeMfwo9TZLN39DQf1rykfo2uBClfP21kY",
  authDomain: "ai-studio-applet-webapp-fbf67.firebaseapp.com",
  projectId: "ai-studio-applet-webapp-fbf67",
  storageBucket: "ai-studio-applet-webapp-fbf67.appspot.com",
  messagingSenderId: "831721646868",
  appId: "1:831721646868:web:308bbf0a9f796f11b4f001"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const post = document.getElementById("post");

// ambil ID dari URL
const id = new URLSearchParams(window.location.search).get("id");

if(!id){
  post.innerHTML = "<p>❌ Artikel tidak ditemukan</p>";
} else {

  db.collection("musicnews_articles").doc(id).get()
  .then((doc) => {

    if(!doc.exists){
      post.innerHTML = "<p>❌ Artikel tidak ditemukan</p>";
      return;
    }

    const d = doc.data();

    let date = "";
    if(d.createdAt){
      if(typeof d.createdAt === "object" && d.createdAt.toDate){
        date = d.createdAt.toDate().toLocaleString();
      } else {
        date = d.createdAt;
      }
    }

    post.innerHTML = `
      ${d.image ? `<img src="${d.image}">` : ""}
      <h1>${d.title || "Tanpa judul"}</h1>
      <div class="date">${date}</div>
      <div class="content">${d.content || ""}</div>
    `;

  })
  .catch((error) => {
    post.innerHTML = "❌ Error: " + error.message;
  });

}

</script>

</body>
</html>
