<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berita MusicNewsID</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f4f4;
}

header{
  background:#111;
  color:#fff;
  padding:15px;
  text-align:center;
}

.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

.title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.date{
  font-size:12px;
  color:gray;
  margin-bottom:10px;
}

.content{
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
}

.status{
  text-align:center;
  padding:10px;
  color:#555;
}
</style>
</head>

<body>

<header>
<h1>Berita MusicNewsID</h1>
</header>

<div class="container" id="newsContainer">
  <div class="status">⏳ Memuat berita...</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>

// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyBeMfwo9TZLN39DQf1rykfo2uBClfP21kY",
  authDomain: "ai-studio-applet-webapp-fbf67.firebaseapp.com",
  projectId: "ai-studio-applet-webapp-fbf67",
  storageBucket: "ai-studio-applet-webapp-fbf67.appspot.com",
  messagingSenderId: "831721646868",
  appId: "1:831721646868:web:308bbf0a9f796f11b4f001"
};

// INIT FIREBASE
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const container = document.getElementById("newsContainer");

// ===== REALTIME LISTENER =====
db.collection("musicnews_articles")
.onSnapshot((snapshot) => {

  container.innerHTML = "";

  if(snapshot.empty){
    container.innerHTML = "<div class='status'>Belum ada berita</div>";
    return;
  }

  snapshot.forEach((doc) => {

    const data = doc.data();

    const title = data.title || "Tanpa judul";
    const content = data.content || "";
    const image = data.image || "";

    // aman untuk timestamp Firestore
    let date = "";
    if(data.createdAt){
      if(typeof data.createdAt === "object" && data.createdAt.toDate){
        date = data.createdAt.toDate().toLocaleString();
      } else {
        date = data.createdAt;
      }
    }

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      ${image ? `<img src="${image}">` : ""}
      <div class="title">${title}</div>
      <div class="date">${date}</div>
      <div class="content">${content}</div>
    `;

    container.appendChild(card);

  });

}, (error) => {

  container.innerHTML =
    "<div class='status'>❌ Error: " + error.message + "</div>";

});

</script>

</body>
</html>
